name: Build nightly release
on:
    workflow_dispatch:
    schedule:
        - cron: "30 19 * * *"
env:
    CI: true
jobs:
    build:
        runs-on: macos-26
        env:
            GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install dependencies
              run: |
                  brew install carthage swiftlint
                  npm install https://github.com/PlayCover/create-dmg

            - name: Fetch Carthage dependencies
              run: |
                  carthage update --use-xcframeworks

            - name: Build
              run: |
                  xcodebuild \
                    -project PlayCover.xcodeproj \
                    -scheme PlayCover \
                    -configuration Nightly \
                    -derivedDataPath build \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    build

            - uses: actions/upload-artifact@v4
              with:
                  name: PlayCover.app
                  path: build/Build/Products/Nightly/PlayCover.app
